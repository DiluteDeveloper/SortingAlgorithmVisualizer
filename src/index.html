<!DOCTYPE html>
<html>
    <head>
        <script type="importmap">
            {
                "imports": {
                    "react": "https://esm.sh/react@latest?dev",
                    "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
                    "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
                }
            }
        </script>
        <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>

        <title>Page Title</title>
    </head>
    <body>
        <div id="app"></div>
        <p>test</p>
        <script type="text/babel" data-type="module" data-presets="react">
            import React from 'react';
            import { createRoot } from 'react-dom/client';

            const domNode = document.getElementById('app');
            const root = createRoot(domNode);
            root.render(Header());

            function Header() {
                let headerTitle = "My Title";
                return (
                    <h1>This is my header: {headerTitle}</h1>
                );
            }

        </script>
    </body>
</html>
